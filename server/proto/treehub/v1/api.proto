// API contract between the TreeHub extension and its backend (Cloudflare Worker + D1).
// Generated into Go (server, protoc-gen-go) and TypeScript (extension, protoc-gen-es) by `make gen`.
//
// Wire format: the Go server encodes the generated structs with encoding/json (proto field
// names, enums as integers) because protojson does not work under TinyGo; the extension
// parses with protoc-gen-es using {useProtoFieldName: true, enumAsInteger: true}.
syntax = "proto3";

package treehub.v1;

option go_package = "github.com/peterxcli/treehub/server/gen/go/treehub/v1;treehubv1";

// A GitHub user signed in to TreeHub. The GitHub handle (login) identifies the user.
message User {
  string login = 1;
  // A string in the extension: protobuf-es maps int64 to bigint, which chrome.storage cannot hold.
  int64 github_id = 2 [jstype = JS_STRING];
  optional string name = 3;
  optional string avatar_url = 4;
  string created_at = 5; // RFC 3339
}

message MeResponse {
  User user = 1;
}

// A new session for the signed-in user (POST /api/session/refresh), valid for 30 days from now. The extension asks
// for one once its session has passed half its lifetime, so that using TreeHub keeps the user signed in. It carries
// the same token version: signing out everywhere revokes it too.
message RefreshSessionResponse {
  string session = 1;
}

// A bookmarked repository.
message Bookmark {
  string repo = 1; // "owner/name"
  string created_at = 2; // RFC 3339
}

message ListBookmarksResponse {
  repeated Bookmark bookmarks = 1; // newest first
}

// A pull request in the user's review queue. Its statuses are computed by the extension
// from GitHub data; the server only remembers what is queued and when it was last seen.
message QueueItem {
  string repo = 1; // "owner/name"
  int32 number = 2;
  optional string title = 3; // cached for display before statuses load
  string added_at = 4; // RFC 3339
  optional string last_seen_at = 5; // RFC 3339, last time the user opened the pull request
}

message ListQueueResponse {
  repeated QueueItem items = 1; // newest first
}

message PutQueueItemRequest {
  optional string title = 1;
}

message ErrorResponse {
  string error = 1; // machine-readable code, e.g. "login_required"
  optional string message = 2;
}

message OkResponse {
  bool ok = 1;
}

// A repository or pull request the user viewed on GitHub, recorded by the extension while signed in. Kept for the
// user's retention (HistorySettings), counted from the last view.
message HistoryItem {
  string kind = 1; // "repo" or "pull"
  string repo = 2; // "owner/name"
  int32 number = 3; // pull request number, 0 for a repository
  optional string title = 4; // pull request title when last viewed
  string first_viewed_at = 5; // RFC 3339 in UTC with milliseconds
  string last_viewed_at = 6; // RFC 3339 in UTC with milliseconds
  int32 view_count = 7;
}

message ListHistoryResponse {
  repeated HistoryItem items = 1; // last viewed first
  optional string next_cursor = 2; // for the next page; absent on the last one
}

message RecordViewRequest {
  optional string title = 1;
}

message RecordViewResponse {
  optional HistoryItem item = 1; // absent when recording is paused
  bool paused = 2;
}

message HistorySettings {
  int32 retention_days = 1; // 1..365, 30 by default
  bool paused = 2; // views aren't recorded while paused
}
