# Publishing a GitHub release tagged vX.Y.Z builds TreeHub with version X.Y.Z, attaches the package to the release
# and submits it to the Chrome Web Store. Pre-releases are skipped.
#
# Repository settings needed:
#   secret   CWS_SERVICE_ACCOUNT  JSON key of the Google Cloud service account added in the Chrome Web Store
#                                 Developer Dashboard (Account section), with the Chrome Web Store API enabled
#   variable CWS_PUBLISHER_ID     publisher ID from the Developer Dashboard
#   variable CWS_EXTENSION_ID     ID of the TreeHub item
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  chrome-web-store:
    name: Chrome Web Store
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Use the release tag as the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - run: npm test

      - run: npm run lint

      - run: npm run dist

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          package="treehub-${TAG#v}-chrome.zip"
          cp dist/chrome.zip "$package"
          gh release upload "$TAG" "$package" --clobber

      - name: Upload to the Chrome Web Store and submit for review
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome.js dist/chrome.zip
